name: Testy

# Testy automatyczne (bez internetu) przy każdym wypchnięciu zmian i pull requeście.
# Python 3.12 - jak wersja .exe; 3.14 - jak lokalna instalacja.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testy:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: constraints.txt

      - name: Instalacja bibliotek
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt

      - name: Testy
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
